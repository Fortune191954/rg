<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f14">
<title>十分钟·肉鸽求生</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#0d0f14; overflow:hidden;
    font-family:"Microsoft YaHei", "PingFang SC", sans-serif; user-select:none;
    -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none;
    overscroll-behavior:none; }
  #wrap { position:relative; width:100vw; height:100vh; }
  canvas { display:block; background:#0d0f14; }
  /* HUD */
  #hud { position:absolute; top:0; left:0; width:100%; padding:10px 16px;
    display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; color:#e8e8e8; }
  #timer { font-size:34px; font-weight:bold; text-shadow:0 2px 6px #000; letter-spacing:2px; }
  #stats { font-size:14px; text-align:right; line-height:1.5; text-shadow:0 1px 4px #000; }
  #hearts { position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; flex-wrap:wrap; gap:3px; justify-content:center; max-width:420px; }
  .heart { width:22px; height:22px; }
  .heart svg { width:100%; height:100%; display:block; filter:drop-shadow(0 1px 3px #000); }
  .heart.low svg { animation:hb .55s infinite alternate; }
  @keyframes hb { from{transform:scale(1);} to{transform:scale(1.15);} }
  #xpline { position:absolute; top:0; left:0; width:100%; height:5px; background:#111; }
  #xpfill { height:100%; width:0%; background:#4dd4ff; transition:width .1s; }
  /* 升级面板 */
  #levelup { position:absolute; inset:0; background:rgba(5,8,15,.85); display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  #levelup h2 { color:#ffd76a; font-size:30px; letter-spacing:4px; }
  #levelup .cards { display:flex; gap:14px; align-items:stretch; }
  .card { width:228px; padding:18px 15px; background:#161c28; border:2px solid #3a4a66;
    border-radius:12px; color:#dde6f2; cursor:pointer; text-align:center; transition:.15s; }
  .card:hover { transform:translateY(-6px); border-color:#ffd76a; box-shadow:0 8px 24px rgba(255,215,106,.25); }
  .card .icon { font-size:32px; margin-bottom:8px; }
  .card .name { font-size:17px; font-weight:bold; margin-bottom:8px; color:#fff; }
  .card .desc { font-size:13px; color:#c9d8ea; line-height:1.55; }
  .card .note { font-size:11px; color:#7d8ea6; line-height:1.45; margin-top:8px;
    padding-top:8px; border-top:1px dashed #2c3850; }
  .badge { display:inline-block; font-size:10px; font-weight:normal; color:#ffd76a;
    border:1px solid #6b5a2a; background:#2a2415; border-radius:4px; padding:1px 5px;
    margin-left:6px; vertical-align:middle; }
  /* 开始 / 结束 */
  .overlay { position:absolute; inset:0; background:rgba(5,8,15,.92); display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:20px; color:#e8e8e8; text-align:center; }
  .overlay h1 { font-size:52px; letter-spacing:6px; }
  .overlay p { color:#9fb0c8; line-height:1.9; font-size:15px; }
  .overlay button { padding:14px 52px; font-size:20px; letter-spacing:4px; background:#ffd76a;
    color:#222; border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
  .overlay button:hover { background:#ffe89a; }
  #endscreen { display:none; }
  #winTitle { color:#7ee787; }
  #loseTitle { color:#ff6b6b; }

  /* 结算统计 */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(100px, 130px));
    gap:10px; justify-content:center; max-width:92vw; }
  .stat { background:#161c28; border:1px solid #2d3a4f; border-radius:10px; padding:12px 8px; }
  .stat .v { font-size:22px; font-weight:bold; color:#ffd76a; line-height:1.2; }
  .stat .k { font-size:12px; color:#8fa3bd; margin-top:3px; }
  #endInfo { font-size:13px; color:#8fa3bd; max-width:92vw; }
  #endInfo b { color:#c9d8ea; }
  .ver { font-size:12px !important; color:#55647c !important; letter-spacing:1px; }

  /* 手机适配 */
  @media (max-width: 720px){
    #levelup h2 { font-size:22px; }
    #levelup .cards { flex-direction:column; gap:10px; width:86vw; max-width:340px; }
    .card { width:100%; padding:12px 14px; display:flex; align-items:flex-start; gap:12px; text-align:left; }
    .card .icon { font-size:24px; margin:2px 0 0; }
    .card .body { flex:1; }
    .card .name { font-size:15px; margin-bottom:3px; }
    .card .desc { font-size:12px; line-height:1.45; }
    .card .note { font-size:11px; margin-top:5px; padding-top:5px; }
    .overlay h1 { font-size:32px; letter-spacing:2px; }
    .overlay p { font-size:13px; padding:0 20px; }
    #timer { font-size:26px; }
    #stats { font-size:12px; }
    .heart { width:19px; height:19px; }
    #hearts { max-width:86vw; bottom:10px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="xpline"><div id="xpfill"></div></div>
  <div id="hud">
    <div id="timer">10:00</div>
    <div id="stats">等级 1<br>击杀 0</div>
  </div>
  <div id="hearts"></div>

  <div id="levelup">
    <h2>⬆ 升级！选择强化</h2>
    <div class="cards" id="cards"></div>
  </div>

  <div class="overlay" id="startscreen">
    <h1 style="color:#ffd76a">十分钟 · 肉鸽求生</h1>
    <p>WASD / 方向键 移动 · 手机<b style="color:#ffd76a">任意位置按住拖动</b>即出摇杆 · 攻击全自动 · 捡拾经验水晶升级并三选一强化<br>
    青色弹幕可以被打掉 · 撑过 <b style="color:#ffd76a">10 分钟</b> 即胜利！第 8 分钟会出现最终 BOSS。<br>
    提示：单刷是下策，走位拉扯才是王道。</p>
    <button id="startBtn">开始挑战</button>
    <p class="ver">v1.8</p>
  </div>

  <div class="overlay" id="endscreen">
    <h1 id="winTitle">🏆 你活下来了！</h1>
    <h1 id="loseTitle">💀 你被吞没了…</h1>
    <div id="endStats" class="stats-grid"></div>
    <p id="endInfo"></p>
    <button id="retryBtn">再来一局</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H, dpr = 1;
let viewScale = 1;              // 世界缩放：手机拉远以扩大视野，桌面保持 1
const REF_AREA = 1280 * 720;    // 桌面参考可视面积

function computeViewScale(){
  if (innerWidth >= 1000) { viewScale = 1; return; }      // 桌面/横屏大屏不缩放
  const s = Math.sqrt((innerWidth * innerHeight) / REF_AREA);
  viewScale = Math.min(1, Math.max(0.72, s));            // 手机适中：最小 0.72
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // 高清渲染，逻辑坐标仍用 CSS 像素
  computeViewScale();
}
addEventListener('resize', resize); resize();

const GAME_TIME = 600;      // 整局 10 分钟（秒）
const BOSS_TIME = 480;      // 第 8 分钟刷最终 BOSS，留 2 分钟 BOSS 战
const SLASH_ARC = 0.40;     // 斩击初始半角（约 46° 扇面）
const SLASH_ARC_STEP = 0.17; // 分裂弹每多一发，扇面加宽的半角
// ---------- 状态 ----------
let state = 'menu'; // menu / playing / levelup / end
let player, enemies, gems, bullets, parts, spawnTimer, gameTime, kills, shake;
let slashFx = [];   // 斩击特效
let stats = { bullet:0, burn:0, orb:0, slash:0 };
let camX = 0, camY = 0; // 相机（世界无限，跟随玩家）
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ---------- 移动端虚拟摇杆 ----------
const joy = { active:false, id:null, bx:0, by:0, kx:0, ky:0, dx:0, dy:0, R:62 };
function joyUpdate(){
  let vx = joy.kx - joy.bx, vy = joy.ky - joy.by;
  const d = Math.hypot(vx,vy);
  if (d > joy.R){ vx = vx/d*joy.R; vy = vy/d*joy.R; }
  joy.kx = joy.bx + vx; joy.ky = joy.by + vy;
  const dead = joy.R*0.18;
  if (d < dead){ joy.dx = 0; joy.dy = 0; }
  else { const m = Math.hypot(vx,vy)||1; joy.dx = vx/m; joy.dy = vy/m; }
}
function joyStart(x,y){ joy.active=true; joy.bx=x; joy.by=y; joy.kx=x; joy.ky=y; joy.dx=0; joy.dy=0; }
function joyEnd(){ joy.active=false; joy.id=null; joy.dx=0; joy.dy=0; }

cv.addEventListener('touchstart', e => {
  if (state !== 'playing') return;
  for (const t of e.changedTouches){
    if (joy.id === null){ joy.id = t.identifier; joyStart(t.clientX, t.clientY); }
  }
  e.preventDefault();
}, { passive:false });

cv.addEventListener('touchmove', e => {
  for (const t of e.changedTouches){
    if (t.identifier === joy.id){ joy.kx = t.clientX; joy.ky = t.clientY; joyUpdate(); }
  }
  e.preventDefault();
}, { passive:false });

['touchend','touchcancel'].forEach(ev =>
  cv.addEventListener(ev, e => {
    for (const t of e.changedTouches){
      if (t.identifier === joy.id) joyEnd();
    }
    e.preventDefault();
  }, { passive:false })
);

// 兜底：手指在弹窗/其他元素上离开时也要松开摇杆
['touchend','touchcancel'].forEach(ev =>
  addEventListener(ev, e => {
    for (const t of e.changedTouches || []){
      if (t.identifier === joy.id) joyEnd();
    }
  }, { passive:true })
);

// ---------- 升级池 ----------
// max: 可选择的次数上限（不写=无限叠加）
const UPGRADES = [
  { icon:'⚔️', name:'利刃', desc:'攻击伤害 +25%', note:'滚雪球核心，越早拿越赚', apply:p=>p.dmg*=1.25 },
  { icon:'⚡', name:'急速扳机', desc:'攻击间隔 -20%，出手更快', note:'与利刃、分裂弹叠加收益最高', apply:p=>p.fireDelay*=0.8 },
  { icon:'👟', name:'疾风步', desc:'移动速度 +12%', note:'走位拉扯的本钱', apply:p=>p.speed*=1.12 },
  { icon:'❤️', name:'强健体魄', desc:'生命上限 +25，并立即回满', note:'残血时选它等于一次复活', apply:p=>{p.maxHp+=25;p.hp=p.maxHp;} },
  { icon:'🧲', name:'磁力水晶', desc:'拾取范围 +40%', note:'后期满地水晶时收益极高', apply:p=>p.magnet*=1.4 },
  { icon:'🔱', name:'分裂弹', desc:'每次攻击多发射 1 发子弹', note:'扇形散射，近身可全中 · 斩击流：每层额外加宽斩击角度', apply:p=>p.multi+=1 },
  { icon:'🎯', name:'穿透弹', desc:'子弹可多穿透 1 个敌人', note:'敌人排成一串时收益翻倍', apply:p=>p.pierce+=1 },
  { icon:'💊', name:'再生', desc:'每秒回复 1 点生命', note:'越早拿越值', apply:p=>p.regen+=1 },
  { icon:'🧛', name:'吸血鬼', desc:'每击杀 1 个敌人，回复 1% 生命上限', note:'限选 1 次 · 与斩击、旋风、分裂弹等高频击杀流派配合收益最高', max:1,
    apply:p=>{ p.vampire = true; } },
  { icon:'💥', name:'致命一击', desc:'暴击率 +10%（暴击双倍伤害）', note:'初始暴击率 5%', apply:p=>p.crit+=0.10 },
  { icon:'🌀', name:'护体旋风', desc:'获得环绕盾牌撞击敌人；每 45 秒 +1 颗，可无限增涨',
    note:'限选 1 次 · 贴身防守，伤害随攻击力提升', max:1,
    apply:p=>{ p.orbs = 1; p.orbT = 45; } },
  { icon:'🔥', name:'灼热弹', desc:'命中附加灼烧，持续 3 秒掉血', note:'对高血量敌人收益明显', apply:p=>p.burn+=2 },
  { icon:'🛡️', name:'减伤装甲', desc:'受到的伤害 -15%', note:'最多叠加到 -60%', apply:p=>p.armor=Math.max(0.4,p.armor*0.85) },
  { icon:'🛞', name:'坦克引擎', desc:'生命上限翻倍并回满，但攻击距离大幅缩短（约 3 个紫球）',
    note:'限选 1 次 · 每击杀 1 个敌人，生命上限 +1%（按选择时的血量上限）', max:1,
    apply:p=>{ p.maxHp*=2; p.hp=p.maxHp; p.atkRange=156; p.killHpBase=p.maxHp; } },
  { icon:'🍳', name:'爽煎滑蛋', desc:'普攻变为斩击：每秒朝最近敌人挥出扇形斩击（60% 伤害，范围伤害，可斩掉青色弹幕）；移动速度 +15%',
    note:'限选 1 次 · 斩击角度初始较窄，每次分裂弹都会加宽 · 移动充能 15 秒后八向斩击（400% 伤害）', max:1,
    apply:p=>{ p.slashMode=true; p.slashEnergy=0; p.speed*=1.15; } },
];

// ---------- 初始化 ----------
function newGame(){
  player = { x:0, y:0, r:14, hp:100, maxHp:100, speed:200, dmg:10, fireDelay:0.45,
    fireT:0, multi:1, pierce:0, magnet:70, regen:0, crit:0.05, orbs:0, burn:0, armor:1,
    level:1, xp:0, xpNeed:5, orbT:45, orbAngle:0, invul:0,
    atkRange:460, slashMode:false, slashEnergy:0, killHpBase:0, faceAng:0, vampire:false,
    taken:{} };
  enemies=[]; gems=[]; bullets=[]; parts=[]; slashFx=[];
  spawnTimer=0; gameTime=0; kills=0; shake=0;
  stats = { bullet:0, burn:0, orb:0, slash:0 };
  camX=0; camY=0;
  joyEnd(); lastHeartKey = '';
}

// ---------- 敌人生成 ----------
function spawnEnemy(){
  const t = gameTime;
  const diff = t/GAME_TIME; // 难度进度 0→1
  const dist = 900 + Math.random()*200;
  const a = Math.random()*Math.PI*2;
  const x = player.x + Math.cos(a)*dist, y = player.y + Math.sin(a)*dist;
  let type = 'grunt';
  const roll = Math.random();
  if (t>60 && roll<0.25) type='fast';
  if (t>120 && roll>0.85) type='tank';
  if (t>240 && roll>0.72) type='shooter';
  const e = { x, y, type, id:++eid, hurtT:0, burnT:0, burnDmg:0 };
  if (type==='grunt'){ e.r=14; e.hp=e.maxHp=20+diff*60; e.spd=70+diff*50; e.dmg=10; e.col='#c94f4f'; e.xp=1; }
  if (type==='fast'){ e.r=10; e.hp=e.maxHp=12+diff*30; e.spd=150+diff*70; e.dmg=8; e.col='#e6b84f'; e.xp=1; }
  if (type==='tank'){ e.r=26; e.hp=e.maxHp=90+diff*220; e.spd=40+diff*25; e.dmg=20; e.col='#8f5fd0'; e.xp=3; }
  if (type==='shooter'){ e.r=13; e.hp=e.maxHp=30+diff*70; e.spd=55; e.dmg=12; e.col='#4fd0c9'; e.xp=2;
    e.shootT = 1+Math.random()*2; }
  enemies.push(e);
}
// BOSS：独立计时触发（不再依赖刷怪节拍，避免错过时间点永不出现）
function spawnBoss(){
  if (spawnedBoss) return;
  spawnedBoss = true;
  shake = 12;
  enemies.push({ x:player.x+400, y:player.y, type:'boss', id:++eid, r:52, hp:2200, maxHp:2200,
    spd:55, dmg:35, col:'#ff3b6b', xp:50, hurtT:0, burnT:0, burnDmg:0, shootT:2, chargeT:5 });
}
let spawnedBoss = false;
let eid = 0;

// ---------- 输入/更新 ----------
function update(dt){
  gameTime += dt;
  if (!spawnedBoss && gameTime >= BOSS_TIME) spawnBoss();
  if (gameTime >= GAME_TIME){ endGame(true); return; }
  // 玩家移动
  let dx=0, dy=0;
  if (keys['w']||keys['arrowup']) dy--;
  if (keys['s']||keys['arrowdown']) dy++;
  if (keys['a']||keys['arrowleft']) dx--;
  if (keys['d']||keys['arrowright']) dx++;
  if (joy.active){ dx += joy.dx; dy += joy.dy; }
  const len = Math.hypot(dx,dy)||1;
  player.x += dx/len*player.speed*dt;
  player.y += dy/len*player.speed*dt;
  if (player.invul>0) player.invul-=dt;
  if (player.regen>0) player.hp = Math.min(player.maxHp, player.hp+player.regen*dt);
  // 记录朝向（斩击方向用）
  const moving = (dx!==0 || dy!==0);
  if (moving) player.faceAng = Math.atan2(dy, dx);

  // 攻击：子弹流 / 斩击流
  player.fireT -= dt;
  if (player.slashMode){
    // 移动充能：满 15 秒释放八向斩击
    if (moving) player.slashEnergy += dt;
    if (player.slashEnergy >= 15){
      player.slashEnergy = 0;
      releaseSlash8();
    }
    if (player.fireT <= 0){
      // 与子弹流一致：自动锁定最近敌人，不再跟随移动方向
      const R = Math.min(200, player.atkRange);
      let best=null, bd=1e9;
      for (const e of enemies){
        if (e.type==='ebullet') continue;
        const d=Math.hypot(e.x-player.x, e.y-player.y); if(d<bd){bd=d;best=e;}
      }
      if (best && bd < R + best.r){
        player.fireT = 1.0;
        const ang = Math.atan2(best.y-player.y, best.x-player.x);
        player.faceAng = ang;
        // 斩击半角：初始较窄，分裂弹每多一发都加宽扇面
        const halfArc = SLASH_ARC + (player.multi-1)*SLASH_ARC_STEP;
        slashAttack(ang, 0.6*player.dmg, R, halfArc, '#dff3ff');
      }
    }
  } else if (player.fireT<=0){
    let best=null, bd=1e9;
    for (const e of enemies){
      if (e.type==='ebullet') continue;
      const d=Math.hypot(e.x-player.x,e.y-player.y); if(d<bd){bd=d;best=e;}
    }
    if (best && bd < player.atkRange){
      player.fireT = player.fireDelay;
      const ang = Math.atan2(best.y-player.y, best.x-player.x);
      for (let i=0;i<player.multi;i++){
        const off = (i-(player.multi-1)/2)*0.16;
        bullets.push({ x:player.x, y:player.y, ang:ang+off, spd:560, dmg:player.dmg,
          pierce:player.pierce, life:0.9, r:5, hit:[] });
      }
    }
  }
  // 护体旋风：每 45 秒 +1 颗（仅可选 1 次，无限增涨）
  if (player.orbs>0){
    player.orbT -= dt;
    if (player.orbT<=0){ player.orbT = 45; player.orbs += 1; }
    player.orbAngle += dt*2.2;
    for (let i=0;i<player.orbs;i++){
      const ox = player.x + Math.cos(player.orbAngle + i*Math.PI*2/player.orbs)*55;
      const oy = player.y + Math.sin(player.orbAngle + i*Math.PI*2/player.orbs)*55;
      for (let j=enemies.length-1;j>=0;j--){
        const e = enemies[j];
        if (e.hp<=0 || e.type==='ebullet') continue;
        if (Math.hypot(e.x-ox,e.y-oy) < e.r+10){
          if ((e.orbCd||0) > gameTime) continue;
          e.orbCd = gameTime + 0.3;
          const od = 25 + player.dmg;
          stats.orb += od; e.hp -= od; hurtFlash(e);
          burst(e.x,e.y,'#7ee7d8',3);
          if (e.hp<=0) killEnemy(e);   // 旋风击杀同样掉经验、计数
        }
      }
    }
  }
  // 子弹
  for (let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += Math.cos(b.ang)*b.spd*dt; b.y += Math.sin(b.ang)*b.spd*dt; b.life-=dt;
    if (b.life<=0){ bullets.splice(i,1); continue; }
    for (const e of enemies){
      if (e.hp<=0) continue;
      if (b.hit.indexOf(e.id) >= 0) continue;
      if (Math.hypot(e.x-b.x,e.y-b.y) < e.r+b.r){
        // 敌弹可被子弹打掉（不计伤害/击杀）
        if (e.type==='ebullet'){
          e.hp = 0; burst(e.x,e.y,'#4fd0c9',6);
          b.hit.push(e.id);
          if (b.pierce > 0) b.pierce--; else bullets.splice(i,1);
          break;
        }
        let dmg = b.dmg;
        let crit = Math.random() < player.crit;
        if (crit) dmg*=2;
        stats.bullet += dmg;
        e.hp -= dmg; hurtFlash(e);
        if (player.burn>0){ e.burnT=3; e.burnDmg=player.burn; }
        burst(b.x,b.y, crit?'#ffd76a':'#9fd0ff', 4);
        if (e.hp<=0) killEnemy(e);
        b.hit.push(e.id);
        // 穿透：还有穿透次数就继续飞，否则消失
        if (b.pierce > 0){ b.pierce--; } else { bullets.splice(i,1); }
        break;
      }
    }
  }
  // 敌人
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if (e.hp<=0){ enemies.splice(i,1); continue; }
    if (e.hurtT>0) e.hurtT-=dt;
    if (e.burnT>0){ e.burnT-=dt; const bd = Math.min(e.burnDmg*dt, Math.max(0,e.hp)); stats.burn += bd; e.hp-=e.burnDmg*dt; if(Math.random()<dt*8) burst(e.x,e.y,'#ff7a3c',1); if(e.hp<=0){killEnemy(e); continue;} }
    const d = Math.hypot(player.x-e.x, player.y-e.y);
    const ang = Math.atan2(player.y-e.y, player.x-e.x);
    // 敌方子弹：直线飞行，不追踪
    if (e.type==='ebullet'){
      e.x += Math.cos(e.ang)*e.spd*dt;
      e.y += Math.sin(e.ang)*e.spd*dt;
      e.life -= dt;
      const dd = Math.hypot(player.x-e.x, player.y-e.y);
      if (dd < e.r+player.r && player.invul<=0){
        player.hp -= e.dmg*player.armor;
        player.invul = 0.5; shake = 8;
        if (player.hp<=0){ endGame(false); return; }
        enemies.splice(i,1); continue;
      }
      if (e.life<=0) enemies.splice(i,1);
      continue;
    }
    if (e.type==='shooter'){
      e.shootT -= dt;
      if (d>260) { e.x+=Math.cos(ang)*e.spd*dt; e.y+=Math.sin(ang)*e.spd*dt; }
      if (e.shootT<=0 && d<520){ e.shootT=2.2;
        // 发射瞬间锁定方向，之后不再追踪
        enemies.push({x:e.x,y:e.y,type:'ebullet',id:++eid,ang:ang,r:6,hp:1,maxHp:1,spd:280,dmg:e.dmg,col:'#4fd0c9',xp:0,life:3,hurtT:0,burnT:0,burnDmg:0});
      }
    } else if (e.type==='boss'){
      e.shootT-=dt; e.chargeT-=dt;
      if (e.chargeT<=0){ e.chargeT=6; e.rushT=1.2; e.rushAng=ang; }
      if (e.rushT>0){ e.rushT-=dt; e.x+=Math.cos(e.rushAng)*e.spd*6*dt; e.y+=Math.sin(e.rushAng)*e.spd*6*dt; }
      else { e.x+=Math.cos(ang)*e.spd*dt; e.y+=Math.sin(ang)*e.spd*dt; }
      if (e.shootT<=0){ e.shootT=1.6;
        for(let k=0;k<8;k++){ const a2=k/8*Math.PI*2 + gameTime*0.6;
          enemies.push({x:e.x,y:e.y,type:'ebullet',id:++eid,ang:a2,r:7,hp:1,maxHp:1,spd:200,dmg:15,col:'#ff8aa8',xp:0,life:4,hurtT:0,burnT:0,burnDmg:0}); }
      }
    } else {
      e.x += Math.cos(ang)*e.spd*dt; e.y += Math.sin(ang)*e.spd*dt;
    }
    // 碰撞玩家
    if (d < e.r+player.r && player.invul<=0){
      player.hp -= e.dmg*player.armor;
      player.invul = 0.5; shake = 8;
      if (player.hp<=0){ endGame(false); return; }
    }
  }
  // 水晶
  for (let i=gems.length-1;i>=0;i--){
    const g = gems[i];
    // 弹出停留期：先向外飞一小段，之后再被磁力吸附
    if (g.t > 0){
      g.t -= dt;
      g.x += g.vx*dt; g.y += g.vy*dt;
      const damp = Math.max(0, 1 - 5*dt);
      g.vx *= damp; g.vy *= damp;
      continue;
    }
    const d = Math.hypot(player.x-g.x, player.y-g.y) || 1;
    if (d < player.magnet){ g.x += (player.x-g.x)/d*300*dt; g.y += (player.y-g.y)/d*300*dt; }
    if (d < player.r+8){
      gems.splice(i,1); player.xp += g.v;
      if (player.xp >= player.xpNeed){ levelUp(); return; }
    }
  }
  // 生成（频率更缓：开局 ~1.2 秒一只，末段 ~0.35 秒一只）
  spawnTimer -= dt;
  const rate = Math.max(0.35, 1.2 - gameTime/GAME_TIME*0.85);
  if (spawnTimer<=0){ spawnTimer = rate; spawnEnemy(); }
  // 粒子
  for (let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if (p.life<=0) parts.splice(i,1);
  }
  // 斩击特效计时
  for (let i=slashFx.length-1;i>=0;i--){
    slashFx[i].life -= dt;
    if (slashFx[i].life<=0) slashFx.splice(i,1);
  }
  if (shake>0) shake-=dt*20;
  camX = player.x - (W/viewScale)/2; camY = player.y - (H/viewScale)/2;
  updateHUD();
}

function hurtFlash(e){ e.hurtT = 0.1; }

// ---------- 斩击（爽煎滑蛋） ----------
function slashAttack(ang, dmg, radius, halfArc, col){
  slashFx.push({ x:player.x, y:player.y, ang, arc:halfArc, radius, life:0.22, maxLife:0.22, col });
  for (let j=enemies.length-1;j>=0;j--){
    const e = enemies[j];
    if (e.hp<=0) continue;
    const d = Math.hypot(e.x-player.x, e.y-player.y);
    if (d > radius + e.r) continue;
    let da = Math.atan2(e.y-player.y, e.x-player.x) - ang;
    while (da >  Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    if (Math.abs(da) > halfArc + Math.atan2(e.r, Math.max(1,d))) continue;
    // 青色敌弹可以被斩击打掉（不计伤害、不计击杀）
    if (e.type==='ebullet'){ e.hp = 0; burst(e.x,e.y,'#4fd0c9',6); continue; }
    let dm = dmg;
    if (Math.random() < player.crit) dm *= 2;
    stats.slash += dm;
    e.hp -= dm; hurtFlash(e);
    if (player.burn>0){ e.burnT=3; e.burnDmg=player.burn; }
    burst(e.x,e.y,col,3);
    if (e.hp<=0) killEnemy(e);
  }
}
function releaseSlash8(){
  shake = 10;
  const R = Math.min(260, player.atkRange);
  slashFx.push({ x:player.x, y:player.y, ring:true, radius:R, life:0.4, maxLife:0.4, col:'#ffe9a8' });
  for (let k=0;k<8;k++){
    const a = k/8*Math.PI*2 + player.faceAng;
    slashAttack(a, 4*player.dmg, R, 0.62, '#ffe9a8');
  }
}
function burst(x,y,col,n){
  for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*200,vy:(Math.random()-0.5)*200,life:0.3,col});
}
function killEnemy(e){
  kills++;
  burst(e.x,e.y,e.col,10);
  // 坦克引擎：每击杀 1 个敌人，生命上限 +1%（基于选择时的血量上限）
  if (player.killHpBase > 0) player.maxHp += player.killHpBase * 0.01;
  // 吸血鬼：每击杀 1 个敌人，回复 1% 生命上限
  if (player.vampire) player.hp = Math.min(player.maxHp, player.hp + player.maxHp*0.01);
  // 水晶先向外弹出并停留片刻（避免被磁力瞬间吸走、看不到掉落）
  if (e.xp>0) for(let i=0;i<e.xp;i++){
    const a = Math.random()*Math.PI*2, sp = 40+Math.random()*40;
    gems.push({ x:e.x, y:e.y, v:1, t:0.55, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp });
  }
  if (e.type==='boss') burst(e.x,e.y,'#ffd76a',40);
}
function levelUp(){
  player.level++; player.xp -= player.xpNeed; player.xpNeed = Math.floor(player.xpNeed*1.1+2);
  state='levelup';
  joyEnd();
  // 限选次数的强化（如护体旋风、坦克引擎、爽煎滑蛋）选过后不再出现
  const avail = UPGRADES.filter(u => !u.max || (player.taken[u.name]||0) < u.max);
  const pool = avail.sort(()=>Math.random()-0.5).slice(0,3);
  const box = document.getElementById('cards');
  box.innerHTML='';
  for (const u of pool){
    const c = document.createElement('div'); c.className='card';
    const badge = u.max ? `<span class="badge">限选 ${u.max} 次</span>` : '';
    c.innerHTML = `<div class="icon">${u.icon}</div>
      <div class="body"><div class="name">${u.name}${badge}</div>
      <div class="desc">${u.desc}</div>
      <div class="note">${u.note||''}</div></div>`;
    c.onclick = ()=>{
      u.apply(player);
      player.taken[u.name] = (player.taken[u.name]||0) + 1;
      document.getElementById('levelup').style.display='none';
      state='playing';
    };
    box.appendChild(c);
  }
  document.getElementById('levelup').style.display='flex';
}
function endGame(win){
  state='end';
  document.getElementById('winTitle').style.display = win?'block':'none';
  document.getElementById('loseTitle').style.display = win?'none':'block';
  const m = Math.floor(gameTime/60), s = Math.floor(gameTime%60);
  const total = Math.round(stats.bullet + stats.burn + stats.orb + stats.slash);
  const dps = Math.round(total / Math.max(1, gameTime));
  const pct = v => total>0 ? Math.round(v/total*100) : 0;
  const card = (v,k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  document.getElementById('endStats').innerHTML =
      card(kills, '击杀数')
    + card(total.toLocaleString(), '总伤害')
    + card(dps, '每秒伤害')
    + card(player.level, '等级')
    + card(`${m}:${String(s).padStart(2,'0')}`, '存活时间');
  const src = [];
  if (stats.bullet>0) src.push(`<b>子弹 ${pct(stats.bullet)}%</b>`);
  if (stats.slash>0)  src.push(`<b>斩击 ${pct(stats.slash)}%</b>`);
  if (stats.burn>0)   src.push(`<b>灼烧 ${pct(stats.burn)}%</b>`);
  if (stats.orb>0)    src.push(`<b>旋风 ${pct(stats.orb)}%</b>`);
  document.getElementById('endInfo').innerHTML = '伤害来源：' + (src.join(' · ') || '—');
  document.getElementById('endscreen').style.display='flex';
}

function updateHUD(){
  const left = Math.max(0, GAME_TIME-gameTime);
  const m=Math.floor(left/60), s=Math.floor(left%60);
  document.getElementById('timer').textContent = `${m}:${String(s).padStart(2,'0')}`;
  document.getElementById('timer').style.color = left<60 ? '#ff6b6b' : '#e8e8e8';
  document.getElementById('stats').innerHTML = `等级 ${player.level}<br>击杀 ${kills}`;
  document.getElementById('xpfill').style.width = (player.xp/player.xpNeed*100)+'%';
  updateHearts();
}

// ---------- 心形血量 ----------
let lastHeartKey = '';
function updateHearts(){
  // 每颗心代表 per 点生命，心数控制在 16 颗以内
  const per = Math.max(10, Math.ceil(player.maxHp/16));
  const total = Math.max(1, Math.ceil(player.maxHp/per));
  const hp = Math.max(0, player.hp);
  const key = total+'|'+(Math.round(hp/per*4)/4)+'|'+(hp<=player.maxHp*0.3);
  if (key === lastHeartKey) return;
  lastHeartKey = key;
  const P = 'M12 21.2C9.2 19 2.2 14.2 2.2 8.9 2.2 5.7 4.7 3.4 7.6 3.4c1.9 0 3.5 1 4.4 2.5.9-1.5 2.5-2.5 4.4-2.5 2.9 0 5.4 2.3 5.4 5.5 0 5.3-7 10.1-9.8 12.3z';
  let html = '';
  const low = hp <= player.maxHp*0.3;
  for (let i=0;i<total;i++){
    const f = Math.min(1, Math.max(0, (hp - i*per)/per)); // 这颗心填充比例
    const w = (f*26).toFixed(2);
    const cid = 'hc'+i;
    const color = low ? '#ff4d4d' : '#e5484d';
    html += `<div class="heart${low&&f>0?' low':''}"><svg viewBox="0 0 24 24">
      <defs><clipPath id="${cid}"><rect x="0" y="0" width="${w}" height="24"/></clipPath></defs>
      <path d="${P}" fill="#2a2f3a" stroke="#4a5464" stroke-width="0.8"/>
      <path d="${P}" fill="${color}" clip-path="url(#${cid})"/>
    </svg></div>`;
  }
  document.getElementById('hearts').innerHTML = html;
}

// ---------- 绘制 ----------
function draw(){
  ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if (shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // 世界变换：先平移相机，再按视野缩放
  ctx.translate(-camX*viewScale, -camY*viewScale);
  ctx.scale(viewScale, viewScale);
  const vw = W/viewScale, vh = H/viewScale;   // 可视世界范围
  // 网格地面
  const gs=80, px = 1/viewScale;              // 保持屏幕 1px 细线
  ctx.strokeStyle='#1a1f2b'; ctx.lineWidth=px;
  const x0 = Math.floor(camX/gs)*gs, y0 = Math.floor(camY/gs)*gs;
  for(let x=x0; x<camX+vw+gs; x+=gs){ ctx.beginPath(); ctx.moveTo(x,camY); ctx.lineTo(x,camY+vh); ctx.stroke(); }
  for(let y=y0; y<camY+vh+gs; y+=gs){ ctx.beginPath(); ctx.moveTo(camX,y); ctx.lineTo(camX+vw,y); ctx.stroke(); }
  if (state==='menu'){ ctx.restore(); return; }
  // 水晶
  for (const g of gems){
    const pop = g.t>0 ? 0.75 + 0.55*(1 - g.t/0.55) : 1;
    ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(gameTime*3);
    ctx.globalAlpha = 0.3;
    ctx.fillStyle='#4dd4ff'; ctx.beginPath(); ctx.arc(0,0,12*pop,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle='#8be6ff';
    ctx.fillRect(-4.5*pop,-4.5*pop,9*pop,9*pop);
    ctx.restore();
  }
  // 敌人
  for (const e of enemies){
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle = e.hurtT>0 ? '#ffffff' : e.col;
    ctx.fill();
    // 深色描边：缩放变小后仍能看清轮廓
    ctx.lineWidth = Math.max(2, e.r*0.14);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.stroke();
    // 血条
    if (e.hp<e.maxHp && e.type!=='ebullet'){
      ctx.fillStyle='#000a'; ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2, 4);
      ctx.fillStyle='#e5484d'; ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2*Math.max(0,e.hp/e.maxHp), 4);
    }
    if (e.type==='boss'){
      ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
      ctx.fillText('BOSS', e.x, e.y-e.r-14);
    }
  }
  // 粒子
  for (const p of parts){ ctx.globalAlpha=p.life/0.3; ctx.fillStyle=p.col; ctx.fillRect(p.x-2,p.y-2,4,4); }
  ctx.globalAlpha=1;
  // 子弹
  for (const b of bullets){
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.9,0,Math.PI*2);
    ctx.fillStyle='rgba(159,208,255,0.22)'; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle='#bfe2ff'; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(10,25,45,0.6)'; ctx.stroke();
  }
  // 旋风盾
  if (player.orbs>0){
    for (let i=0;i<player.orbs;i++){
      const ox2 = player.x + Math.cos(player.orbAngle + i*Math.PI*2/player.orbs)*55;
      const oy2 = player.y + Math.sin(player.orbAngle + i*Math.PI*2/player.orbs)*55;
      ctx.beginPath(); ctx.arc(ox2,oy2,9,0,Math.PI*2);
      ctx.fillStyle='#7ee7d8'; ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,40,40,0.55)'; ctx.stroke();
    }
  }
  // 斩击特效
  for (const s of slashFx){
    const p = 1 - s.life/s.maxLife;
    const r = s.radius * (0.55 + 0.5*p);
    ctx.globalAlpha = (1-p)*0.95;
    ctx.strokeStyle = s.col;
    ctx.lineWidth = s.ring ? Math.max(2, 5*(1-p)) : Math.max(3, 16*(1-p));
    ctx.beginPath();
    if (s.ring) ctx.arc(s.x, s.y, r, 0, Math.PI*2);
    else ctx.arc(s.x, s.y, r, s.ang - s.arc, s.ang + s.arc);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 玩家
  ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle = player.invul>0 && Math.floor(gameTime*20)%2 ? '#666' : '#f2f2f2';
  ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#2b6cff'; ctx.stroke();
  // 斩击充能环（满 15 秒释放八向斩击）
  if (player.slashMode){
    const t = Math.min(1, player.slashEnergy/15);
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r+9, -Math.PI/2, -Math.PI/2 + t*Math.PI*2);
    ctx.lineWidth = 4; ctx.strokeStyle = t>=0.999 ? '#ffe9a8' : 'rgba(255,233,168,0.75)';
    ctx.stroke();
  }
  ctx.fillStyle='#2b6cff'; // 朝向指示（指向最近敌人）
  let nearest=null,bd=1e9;
  for(const e of enemies){ if(e.type==='ebullet') continue; const d=Math.hypot(e.x-player.x,e.y-player.y);if(d<bd){bd=d;nearest=e;} }
  const fa = nearest ? Math.atan2(nearest.y-player.y,nearest.x-player.x) : player.faceAng;
  ctx.beginPath(); ctx.arc(player.x+Math.cos(fa)*10, player.y+Math.sin(fa)*10, 5, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 摇杆（屏幕坐标）
  if (joy.active && state==='playing'){
    ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.R, 0, Math.PI*2);
    ctx.fillStyle = '#1b2333'; ctx.fill();
    ctx.strokeStyle = '#5a7392'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 26, 0, Math.PI*2);
    ctx.fillStyle = '#8fc6ff'; ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---------- 主循环 ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (state==='playing') update(dt);
  else if (state==='levelup'||state==='end') updateHUD();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- 按钮 ----------
document.getElementById('startBtn').onclick = ()=>{
  document.getElementById('startscreen').style.display='none';
  newGame(); spawnedBoss=false; state='playing';
};
document.getElementById('retryBtn').onclick = ()=>{
  document.getElementById('endscreen').style.display='none';
  newGame(); spawnedBoss=false; state='playing';
};
</script>
</body>
</html>
